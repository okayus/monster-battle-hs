# End-to-end run: the production image, and TS 版's browser tests pointed at it.
#
#   docker compose -f docker-compose.e2e.yml up --build --exit-code-from e2e
#   docker compose -f docker-compose.e2e.yml down
#
# Some of the specs only, while the app is still being built:
#
#   docker compose -f docker-compose.e2e.yml run --rm --build e2e \
#     pnpm exec playwright test tests/serving.spec.ts tests/map.spec.ts
#
# e2e/ is TS 版's, unchanged; it knows the app only by BASE_URL. Two things
# differ from TS 版's file, both because of where this repository is:
#
#  - The project name. The same machine runs TS 版's e2e as well, and with
#    one shared name, `down` in one repository would remove the other's
#    containers.
#  - The healthcheck. TS 版 asks with `node -e fetch(…)`, and this image has
#    no Node. bash can open a TCP connection by itself (/dev/tcp), so the
#    check is a raw HTTP/1.0 request and a look at the status line.
name: monster-battle-hs-e2e

services:
  # The thing under test: the same `prod` stage `docker build --target prod`
  # produces.
  server:
    build:
      context: .
      target: prod
    # A database that lives in memory and dies with the container: every run
    # starts from a freshly migrated and seeded one. Owned by uid 1000, the
    # user the server runs as.
    tmpfs:
      - /app/data:uid=1000,gid=1000
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/3000 && printf "GET /api/health HTTP/1.0\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 1s
      timeout: 3s
      retries: 30

  e2e:
    build:
      context: ./e2e
    # Shares the server's network and reaches it at 127.0.0.1, for the reasons
    # TS 版's docker-compose.e2e.yml gives (an address needs no name lookup,
    # and has no HSTS entry).
    network_mode: service:server
    environment:
      BASE_URL: http://127.0.0.1:3000
      CI: ${CI:-}
    depends_on:
      server:
        condition: service_healthy
    shm_size: 1gb
